server:
  port: 8080  #deploy
  servlet:
    context-path: /api


spring:
  application:
    name: ShakedBackendService

  datasource:
    url: jdbc:mysql://database:3306/shaked?allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: ${MYSQL_ROOT_PASSWORD}
    sqlScriptEncoding: UTF-8
    testWhileIdle: true
    validationQuery: SELECT 1

  servlet:
    multipart:
      max-file-size: 2000MB
      max-request-size: 20000MB


  # ==============================================================
  # = Hibernate ddl auto (create, create-drop, update)
  # ==============================================================
  jpa:
    generate-ddl: true
    hibernate:
      dll-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
    show-sql: true

admin:
  username: ${ADMIN_USERNAME}
  password: ${ADMIN_PASSWORD}

---
server:
  profiles: local
  port: 8081  #deploy

spring:
  profiles: local
  datasource:
    url: jdbc:mysql://localhost:3306/shaked?sessionVariables=sql_mode='NO_ENGINE_SUBSTITUTION'&jdbcCompliantTruncation=false&verifyServerCertificate=false&useSSL=false&requireSSL=false&zeroDateTimeBehavior=convertToNull
    username: root
    password: password
    sqlScriptEncoding: UTF-8

management:
  admin:
    username: shai
    password: shai
