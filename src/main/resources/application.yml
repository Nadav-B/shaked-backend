server:
  port: ${PORT}


spring:
  application:
    name: Geonames importer

  # ==============================================================
  # = Spring Security / Queries for AuthenticationManagerBuilder
  # ==============================================================
  queries:
    users-query: select email, password, active from user where email=?
    roles-query: select u.email, r.role from user u inner join user_rol

  datasource:
    url: jdbc:mysql://localhost:3308/shaked?sessionVariables=sql_mode='NO_ENGINE_SUBSTITUTION'&jdbcCompliantTruncation=false&verifyServerCertificate=false&useSSL=false&requireSSL=false&zeroDateTimeBehavior=convertToNull

    username: root
    password: password
    sqlScriptEncoding: UTF-8

    testWhileIdle: true
    validationQuery: SELECT 1



  # ==============================================================
  # = Hibernate ddl auto (create, create-drop, update)
  # ==============================================================
  jpa:
    generate-ddl: true
    hibernate:
      dll-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: false

website:
  cros: ${WEBSITE_URL}