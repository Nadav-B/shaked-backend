server:
  port: 8080
  servlet:
    context-path: /api
spring:
  application:
    name: ShakedBackendService

  datasource:
    url: jdbc:mysql://database:3306/shaked?allowPublicKeyRetrieval=true&useSSL=false
    username:  ${MYSQL_ROOT_USERNAME:root}
    password: ${MYSQL_ROOT_PASSWORD:password}
    sqlScriptEncoding: UTF-8
    testWhileIdle: true
    validationQuery: SELECT 1

  servlet:
    multipart:
      max-file-size: 2000MB
      max-request-size: 20000MB


  # ==============================================================
  # = Hibernate ddl auto (create, create-drop, update)
  # ==============================================================
  jpa:
    generate-ddl: true
    hibernate:
      dll-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
    show-sql: false

management:
  admin:
    username: ${ADMIN_USERNAME}
    password: ${ADMIN_PASSWORD}
    key: ${HASH_KEY}


